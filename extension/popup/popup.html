<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DEVSnitcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <h1>DEV<span>SNITCHER</span></h1>
      <p class="tagline">Press SNITCH. Paste into AI.</p>
    </header>

    <main>
      <label class="field">
        <span class="label">What were you trying to do?</span>
        <textarea
          id="notes"
          rows="2"
          placeholder="e.g. Clicked Save. Nothing happened."
          maxlength="280"
        ></textarea>
      </label>

      <label class="checkbox">
        <input id="screenshot" type="checkbox" checked />
        <span>Include screenshot</span>
      </label>

      <button id="snitch" class="snitch" type="button">
        <span class="snitch-label">SNITCH</span>
        <span class="snitch-state" id="state">Ready</span>
      </button>

      <button id="paste" class="snitch" type="button" hidden>
        <span class="snitch-label">PASTE SNITCHSHOT</span>
        <span class="snitch-state">Insert into focused field</span>
      </button>

      <p id="result" class="result" role="status" aria-live="polite"></p>
    </main>

    <footer class="footer">
      <span>Local only. Nothing leaves your browser.</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
